name: Publish

on:
  push:
    tags:
      - "*.*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker login
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ghcr.io/oliumbi/webserver:latest
            ghcr.io/oliumbi/webserver:${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/oliumbi/webserver:latest
          cache-to: type=inline